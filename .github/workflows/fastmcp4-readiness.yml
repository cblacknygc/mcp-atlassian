name: FastMCP 4 readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/mcp_atlassian/servers/**"
      - "tests/fastmcp4/**"
      - "scripts/fastmcp4_readiness.py"
      - "scripts/mcp_wire_probe.py"
      - ".github/workflows/fastmcp4-readiness.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: fastmcp4-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published:
    name: Published prerelease / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          cache: true

      - name: Install exact published target
        run: uv sync --frozen --all-extras --dev

      - name: Run advisory readiness suites
        run: >-
          uv run python scripts/fastmcp4_readiness.py run
          --target published
          --suite all
          --advisory
          --output-dir .readiness/published-${{ matrix.python-version }}

      - name: Add readiness summary
        if: always()
        run: >-
          cat .readiness/published-${{ matrix.python-version }}/summary.md
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastmcp4-published-${{ matrix.python-version }}
          path: .readiness/published-${{ matrix.python-version }}

  upstream-main:
    name: Upstream main / exact SHA
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout FastMCP main
        uses: actions/checkout@v4
        with:
          repository: PrefectHQ/fastmcp
          ref: main
          path: .readiness/fastmcp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          cache: true

      - name: Install base project
        run: uv sync --frozen --all-extras --dev

      - name: Overlay exact FastMCP main checkout
        run: |
          uv pip install --no-config --python .venv/bin/python \
            --upgrade "mcp>=2,<3" "mcp-types>=2,<3"
          uv pip install --no-config --python .venv/bin/python \
            --no-deps --reinstall \
            -e .readiness/fastmcp/fastmcp_slim \
            -e .readiness/fastmcp
          echo "FASTMCP_GIT_SHA=$(git -C .readiness/fastmcp rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run advisory readiness suites
        run: >-
          .venv/bin/python scripts/fastmcp4_readiness.py run
          --target upstream-main
          --suite all
          --advisory
          --output-dir .readiness/upstream-main

      - name: Run broad server compatibility
        run: >-
          .venv/bin/python scripts/fastmcp4_readiness.py run
          --target upstream-main
          --suite broad-compat
          --advisory
          --output-dir .readiness/upstream-main-broad

      - name: Add readiness summary
        if: always()
        run: |
          cat .readiness/upstream-main/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat .readiness/upstream-main-broad/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastmcp4-upstream-main
          path: |
            .readiness/upstream-main
            .readiness/upstream-main-broad
