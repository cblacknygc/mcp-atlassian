[blockers.ENV-001]
gate = "G0"
description = "Production FastMCP-facing modules import and construct under FastMCP 4."
tests = [
    "tests/fastmcp4/test_import_startup.py::test_production_modules_import_and_construct",
]

[blockers.POL-001]
gate = "G4"
description = "A read-only-hidden write tool cannot be listed or called."
tests = [
    "tests/fastmcp4/test_tool_policy_contract.py::test_hidden_tool_cannot_be_called",
]

[blockers.API-001]
gate = "G2"
description = "Deprecated-tool tests still call the removed private _call_tool_mcp API."
tests = [
    "tests/unit/servers/test_error_handling.py::test_deprecated_tool_is_preserved_in_registered_mcp_tool",
]

[blockers.POL-002]
gate = "G4"
description = "The existing policy regression test patches the removed private _call_tool_mcp API."
tests = [
    "tests/unit/servers/test_mcp_protocol.py::test_call_tool_mcp_enforces_enablement_at_dispatch",
]
